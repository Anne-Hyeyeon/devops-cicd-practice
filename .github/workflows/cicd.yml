name: CI (container)

# Trigger 규칙
# - main, feature/** 브랜치 push: 테스트 후 Docker 이미지를 빌드해 ECR에 push
# - main 대상 PR: 테스트 + 이미지 빌드만 (push 안 함)
# - 문서만 바뀐 경우(*.md)는 실행하지 않음
on:
  push:
    branches: [main, 'feature/**']
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: sample-server
  # 액세스 키 대신 GitHub OIDC로 이 IAM 역할을 맡아 ECR에 push (시크릿 저장 불필요)
  AWS_ROLE_ARN: arn:aws:iam::976193231337:role/github-actions-ecr-push

permissions:
  id-token: write # OIDC 토큰 발급
  contents: read

jobs:
  test:
    name: Test (lint, unit, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx eslint "{src,test}/**/*.ts"
      - run: npm test
      - run: npm run test:e2e

  image:
    name: Build image & push to ECR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image tags (version + commit + latest)
        id: meta
        run: |
          REGISTRY="${{ steps.ecr.outputs.registry || 'local' }}"
          IMAGE="$REGISTRY/${{ env.ECR_REPOSITORY }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="v1.0.${{ github.run_number }}"
          {
            echo "tags<<EOF"
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:$SHORT_SHA"
            echo "$IMAGE:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "### Image tags" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$VERSION\`, \`$SHORT_SHA\`, \`latest\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - name: Build (and push on non-PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # EC2(x86_64)에서 exec format error 방지
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha # 레이어 캐시로 빌드 시간 단축
          cache-to: type=gha,mode=max
