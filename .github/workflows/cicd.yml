name: CI/CD

# Trigger 규칙
# - feature/** 브랜치 push, main 대상 PR: CI만 실행 (테스트 + 빌드)
# - main 브랜치 push: CI 성공 후 CD(배포)까지 실행
# - 문서만 바뀐 경우(*.md)는 실행하지 않음
on:
  push:
    branches: [main, 'feature/**']
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  APP_NAME: sample-server
  APP_DIR: ~/sample-server
  APP_PORT: 3000

jobs:
  ci:
    name: CI (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint "{src,test}/**/*.ts"

      - name: Unit test
        run: npm test

      - name: E2E test
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: |
            dist
            package.json
            package-lock.json
          retention-days: 7

  deploy:
    name: CD (deploy to EC2)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
      EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
    steps:
      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USERNAME" ] || [ -z "$EC2_SSH_PRIVATE_KEY" ]; then
            echo "EC2 Secrets가 등록되지 않아 배포를 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifact
        if: steps.check.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: server-build
          path: build

      - name: Setup SSH key
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy files to EC2 (scp)
        if: steps.check.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/ec2.pem $EC2_USERNAME@$EC2_HOST "mkdir -p ${{ env.APP_DIR }}"
          scp -i ~/.ssh/ec2.pem -r build/dist build/package.json build/package-lock.json \
            $EC2_USERNAME@$EC2_HOST:${{ env.APP_DIR }}/

      - name: Restart process (pm2)
        if: steps.check.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/ec2.pem $EC2_USERNAME@$EC2_HOST << 'EOF'
            cd ~/sample-server
            npm ci --omit=dev
            pm2 delete sample-server || true
            pm2 start dist/main.js --name sample-server
            pm2 save
          EOF

      - name: Health check
        if: steps.check.outputs.ready == 'true'
        run: |
          sleep 5
          curl -fsS http://$EC2_HOST:${{ env.APP_PORT }}/
